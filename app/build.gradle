plugins {
    id 'com.android.application'
}

android {
    namespace 'com.dudai.roommates'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dudai.roommates'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// No external libraries: everything uses the plain Android framework.
dependencies {
}
